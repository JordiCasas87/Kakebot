spring.application.name=kakebot

# Database (local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kakebot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.base-url=${TELEGRAM_BOT_BASE_URL:https://api.telegram.org/bot}
